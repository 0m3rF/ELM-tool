name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v2.*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/elm-desktop/package-lock.json
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf unixodbc-dev
      - name: macOS ODBC manager
        if: runner.os == 'macOS'
        run: brew install unixodbc
      - run: npm ci
        working-directory: crates/elm-desktop
      - run: npm run prepare:sidecar
        working-directory: crates/elm-desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/elm-desktop
          args: --config src-tauri/tauri.release.conf.json
          tagName: v__VERSION__
          releaseName: ELM Tool v__VERSION__
          releaseDraft: true

  standalone:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux ODBC manager
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - name: macOS ODBC manager
        if: runner.os == 'macOS'
        run: brew install unixodbc
      - run: cargo build --release -p elm-cli -p elm-daemon --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: elm-standalone-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/elm*
