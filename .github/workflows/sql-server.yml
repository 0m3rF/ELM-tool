name: SQL Server integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/elm-connectors/**"
      - "crates/elm-core/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "tests/sql-server/**"
      - ".github/workflows/sql-server.yml"

permissions:
  contents: read

jobs:
  sql-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable fixture credential
        shell: bash
        run: |
          fixture_password="Elm-test-$(openssl rand -hex 24)!"
          echo "::add-mask::$fixture_password"
          echo "ELM_TEST_SQL_SERVER_PASSWORD=$fixture_password" >> "$GITHUB_ENV"
      - name: Run native source, staging, and recovery tests
        run: docker compose -p elm-sql-acceptance -f tests/sql-server/compose.yml up --build --abort-on-container-exit --exit-code-from tests
      - name: Remove disposable fixture and build volumes
        if: always()
        run: docker compose -p elm-sql-acceptance -f tests/sql-server/compose.yml down --volumes
