# Disposable fixtures only. Never substitute production database addresses.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: elm_matrix
      POSTGRES_PASSWORD: ${ELM_MATRIX_PASSWORD:?Set a disposable test password}
    ports: ["127.0.0.1:55441:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elm_matrix"]
      interval: 3s
      timeout: 3s
      retries: 30
  mysql:
    image: mysql:8.4
    command: ["--local-infile=1"]
    environment:
      MYSQL_DATABASE: elm_matrix
      MYSQL_ROOT_PASSWORD: ${ELM_MATRIX_PASSWORD:?Set a disposable test password}
      MYSQL_ROOT_HOST: "%"
    ports: ["127.0.0.1:53341:3306"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=tcp -h 127.0.0.1 -u root -D elm_matrix -e 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 15s
